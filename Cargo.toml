[package]
name = "lanes"
version = "0.1.0"
edition = "2021"
description = "Predictive multi-chat stored as a single phext file"
license = "MIT"
publish = false

[dependencies]
# Pinned for the Rust 1.83 toolchain. Newer clap/tokio/hyper require edition 2024.
axum = "=0.7.9"
chrono = "=0.4.39"
clap = { version = "=4.5.23", features = ["derive"] }
hyper = "=1.5.2"
hyper-util = "=0.1.10"
libphext = "=0.3.3"
memmap2 = "=0.9.5"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"
hmac = "=0.12.1"
sha2 = "=0.10.8"
tokio = { version = "=1.42.0", features = ["macros", "net", "rt-multi-thread"] }
# ureq 2.8 pulls url ^2. Pin below the idna 1 / edition 2024 line.
ureq = { version = "=2.8.0", default-features = false, features = ["tls"] }
url = "=2.5.2"

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
