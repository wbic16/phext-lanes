<!DOCTYPE html>
<html lang="en" data-fabric="%%FABRIC%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<meta name="description" content="%%DESCRIPTION%%">
<meta property="og:site_name" content="Lanes">
<meta property="og:title" content="%%OG_TITLE%%">
<meta property="og:description" content="%%OG_DESCRIPTION%%">
<meta property="og:type" content="%%OG_TYPE%%">
<meta property="og:url" content="%%OG_URL%%">
<style>
  :root {
    color-scheme: light;
    --ink: #221f1b;
    --muted: #7a736a;
    --faint: #9a9288;
    --paper: #f4f1ea;
    --line: #e6e0d6;
    --preview: #4a453f;
    --mark: #efe6d4;
    --band: #ece8df;
    --dock: rgba(244, 241, 234, 0.94);
    --danger: #8a3a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ink: #e4ddd2;
      --muted: #a89f94;
      --faint: #877f74;
      --paper: #161411;
      --line: #3a342c;
      --preview: #c9bfb2;
      --mark: #2a261f;
      --band: #1e1b17;
      --dock: rgba(22, 20, 17, 0.94);
      --danger: #e0a090;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--paper);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 18px;
    line-height: 1.45;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  .wrap {
    max-width: 38rem;
    margin: 0 auto;
    padding: 12vh 1.5rem 11rem;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.5rem;
    margin-bottom: 3.5rem;
  }
  .brand { font-size: 1.15rem; letter-spacing: -0.02em; color: inherit; text-decoration: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: baseline; justify-content: flex-end; }
  a.quiet { color: var(--muted); text-decoration: none; }
  a.quiet:hover, a.quiet:focus-visible { color: var(--ink); }
  #fabric { max-width: 8rem; }
  .create { margin: -2.4rem 0 2.4rem; color: var(--muted); font-size: 0.92rem; }
  .create a { color: inherit; }
  .create-row { display: flex; flex-wrap: wrap; gap: 0.9rem; align-items: baseline; margin-top: 0.45rem; }
  .plot-key, #fabric-name {
    width: 9rem;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    padding: 0.1rem 0;
    color: var(--ink);
  }
  select, .quiet {
    background: transparent;
    border: 0;
    padding: 0;
    color: var(--muted);
  }
  select { cursor: pointer; }
  .quiet[aria-pressed="true"] { color: var(--ink); }
  .item { border-bottom: 1px solid var(--line); }
  .rowline { display: flex; gap: 0.75rem; align-items: baseline; }
  .row {
    display: flex;
    gap: 1.25rem;
    align-items: baseline;
    flex: 1;
    min-width: 0;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 1rem 0;
    cursor: pointer;
  }
  .copylink {
    flex: none;
    background: transparent;
    border: 0;
    padding: 0;
    color: var(--faint);
    font-size: 0.8rem;
  }
  .copylink.for-thread { padding: 1rem 0; }
  .copylink:hover, .copylink:focus-visible { color: var(--muted); }
  .by .copylink { margin-left: 0.45rem; }
  .title { flex: none; font-weight: 600; }
  .preview {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--preview);
  }
  .meta, .coord { display: none; }
  body.details .meta { display: block; }
  body.details .coord { display: inline; }
  .meta {
    margin: -0.35rem 0 0.9rem;
    color: var(--faint);
    font-size: 0.82rem;
  }
  .reading { padding: 0.25rem 0 0.5rem; }
  .msg {
    border-radius: 2px;
    margin: 0 -0.55rem;
    padding: 0.7rem 0.55rem 0.8rem;
  }
  .msg:first-of-type { margin-top: 0.65rem; }
  .msg:nth-of-type(even) { background: var(--band); }
  .msg.mark { background: var(--mark); }
  .msg p a {
    color: inherit;
    text-decoration-color: var(--faint);
    text-underline-offset: 0.15em;
  }
  .msg p a:hover, .msg p a:focus-visible { text-decoration-color: var(--ink); }
  .by { margin: 0 0 0.2rem; color: var(--muted); font-size: 0.88rem; }
  .msg p { margin: 0; white-space: pre-wrap; }
  .held {
    margin: 1.75rem 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .empty { margin: 0.75rem 0 0; color: var(--muted); }
  .post-title { margin: 0 0 0.35rem; font-weight: 600; }
  .more { display: inline-block; margin: 0.35rem 0 1.25rem; }
  .extra {
    margin: 2.5rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .extra p { margin: 0.35rem 0; }
  .texty {
    background: transparent;
    border: 0;
    padding: 0;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #signin-choices { display: contents; }
  #signin-choices[hidden] { display: none; }
  #toc {
    white-space: pre-wrap;
    font-family: ui-monospace, "Cascadia Mono", monospace;
    font-size: 0.72rem;
    line-height: 1.45;
    color: var(--faint);
  }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--dock);
    border-top: 1px solid var(--line);
  }
  .dock-inner { max-width: 38rem; margin: 0 auto; padding: 0.85rem 1.5rem 1rem; }
  textarea {
    width: 100%;
    border: 0;
    resize: none;
    background: transparent;
    padding: 0.15rem 0;
    min-height: 2.8rem;
    line-height: 1.45;
  }
  .you { margin: -2.2rem 0 2.2rem; color: var(--muted); font-size: 0.95rem; }
  .you[hidden] { display: none; }
  .you button { background: transparent; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .welcome { margin: 0 0 2.5rem; }
  .welcome p { margin: 0.85rem 0; }
  .welcome button { margin-top: 1.1rem; background: transparent; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .hint, .status { margin: 0.15rem 0 0; font-size: 0.92rem; }
  .hint { color: var(--muted); }
  .hint button { background: transparent; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .status { min-height: 1.2em; color: var(--ink); }
  .status.error { color: var(--danger); }
  .picker { display: flex; flex-wrap: wrap; gap: 0.45rem 1rem; margin: 0 0 0.7rem; }
  .picker button {
    background: transparent;
    border: 0;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #reason { display: none; margin: 0.2rem 0 0; color: var(--faint); font-size: 0.82rem; }
  body.details #reason { display: block; }
  @media (max-width: 640px) {
    body { font-size: 17px; }
    .wrap { padding: 1.25rem 1rem 12rem; }
    header { flex-wrap: wrap; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.75rem; }
    .tools { justify-content: flex-start; gap: 0.85rem 1rem; }
    .you { margin: 0 0 1.5rem; }
    .row { gap: 0.75rem; }
    .preview { white-space: normal; }
    .dock-inner { padding-left: 1rem; padding-right: 1rem; }
    textarea, input, select { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="%%HOME%%">Lanes</a>
      <div class="tools">
        <select id="fabric" aria-label="Fabric"></select>
        <button type="button" class="quiet" id="create-fabric">create fabric</button>
        <a class="quiet fork" id="fork" href="%%FORK%%">fork</a>
        <button type="button" class="quiet" id="signin">Sign in</button>
        <span id="signin-choices" hidden>
          <a class="quiet" id="signin-github" href="/auth/github">GitHub</a>
          <a class="quiet" id="signin-google" href="/auth/google">Google</a>
        </span>
        <select id="user" aria-label="You"></select>
        <button type="button" class="quiet" id="details" aria-pressed="false">details</button>
      </div>
    </header>
    <p id="you" class="you" hidden>Signed in as <span id="you-name"></span> · <button type="button" id="signout">Sign out</button></p>
    <div id="welcome" class="welcome" hidden>
      <p>Lanes is one quiet feed for this chat.</p>
      <p>Each line is a thread. Open it to read the notes inside.</p>
      <p>The box at the bottom starts a thread, or replies to the one it names.</p>
      <button type="button" id="welcome-go">Continue</button>
    </div>
    <div id="create-panel" class="create" hidden>
      <p id="create-note"><a href="https://mirrorborn.us">Founding plot holders in Tessera can create fabrics.</a></p>
      <div class="create-row">
        <input id="plot-key" class="plot-key" type="password" autocomplete="off" aria-label="Plot key" placeholder="plot key">
      </div>
      <form id="create-form" class="create-row" hidden>
        <input id="fabric-name" type="text" maxlength="32" autocomplete="off" aria-label="Fabric name" placeholder="name">
        <input id="fabric-file" type="file" accept=".phext,text/plain" aria-label="Phext file">
        <button type="button" class="quiet" id="fabric-empty">empty</button>
        <button type="button" class="quiet" id="fabric-upload">upload</button>
      </form>
    </div>
    <main id="feed"></main>
    <p id="held" class="held" hidden></p>
    <div id="extra" class="extra" hidden></div>
  </div>
  <form id="composer" class="dock">
    <div class="dock-inner">
      <div id="picker" class="picker" hidden></div>
      <label class="sr" for="text">Message</label>
      <textarea id="text" rows="2" maxlength="4000" placeholder="Write a message"></textarea>
      <p class="hint"><span id="kind">Reply</span> · Posting to: <span id="where">…</span> — <button type="button" id="change">change</button> — <button type="button" id="fresh">Start a thread</button></p>
      <p id="reason"></p>
      <p id="status" class="status" role="status"></p>
    </div>
  </form>
<script>
const state = {
  user: localStorage.getItem("lanes.user") || "mira",
  data: null,
  open: null,
  room: null,
  highlight: null,
  scrollToMark: false,
  routeGen: 0,
  override: null,
  suggestion: null,
  picker: false,
  loadGen: 0,
  suggestGen: 0,
  timer: 0,
  feedShown: 40,
  tocKey: "",
  tocText: "",
  session: null,
  fresh: false,
};

const $ = (id) => document.getElementById(id);

function root() {
  const name = document.documentElement.getAttribute("data-fabric") || "";
  return name ? "/f/" + name : "";
}

function api(path) {
  return root() + path;
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
      else if (value !== null && value !== undefined) node.setAttribute(key, value);
    }
  }
  for (const child of children || []) if (child) node.append(child);
  return node;
}

function setStatus(text, isError) {
  const node = $("status");
  node.textContent = text || "";
  node.classList.toggle("error", Boolean(isError));
}

function whereTitle() {
  if (state.override) return state.override.title;
  if (!state.suggestion) return "…";
  return state.suggestion.title || "a new thread";
}

function replyTarget() {
  if (state.open && state.room && !state.room.plain && state.room.thread === state.open) {
    return { thread: state.room.thread, title: state.room.title };
  }
  return null;
}

function paintWhere() {
  const freshButton = $("fresh");
  if (freshButton) freshButton.textContent = state.fresh ? "Reply instead" : "Start a thread";
  let kind = "Reply";
  let title = whereTitle();
  if (state.fresh) {
    kind = "Start a thread";
    title = (state.suggestion && state.suggestion.title) || "a new thread";
  } else if (!state.override) {
    const open = replyTarget();
    if (open) title = open.title;
    else if (state.suggestion && state.suggestion.new_thread) {
      kind = "Start a thread";
      title = state.suggestion.title || "a new thread";
    }
  }
  const kindNode = $("kind");
  if (kindNode) kindNode.textContent = kind;
  $("where").textContent = title;
  const reason = $("reason");
  if (state.override) {
    reason.textContent = state.override.thread;
  } else if (state.suggestion) {
    reason.textContent = state.suggestion.reason || "";
  } else {
    reason.textContent = "";
  }
}

function writeHeaders(extra) {
  const headers = extra || {};
  if (state.session && state.session.csrf) headers["x-csrf-token"] = state.session.csrf;
  return headers;
}

function authNext() {
  return encodeURIComponent(location.pathname + location.search);
}

function paintSignIn() {
  const session = state.session || {};
  const button = $("signin");
  const choices = $("signin-choices");
  const you = $("you");
  choices.hidden = true;
  if (session.signed_in) {
    button.hidden = true;
    you.hidden = false;
    $("you-name").textContent = session.name || session.handle || "you";
    return;
  }
  button.hidden = false;
  button.textContent = "Sign in";
  you.hidden = true;
}

function maybeWelcome() {
  const on = new URLSearchParams(location.search).get("welcome") === "1";
  $("welcome").hidden = !on;
  $("feed").hidden = on;
  $("composer").hidden = on;
}

async function loadSession() {
  const res = await fetch("/api/session");
  const body = await res.json().catch(() => ({}));
  state.session = body || {};
  paintSignIn();
}

async function loadState() {
  const gen = ++state.loadGen;
  const signedIn = state.session && state.session.signed_in;
  const query = signedIn ? "" : ("?user=" + encodeURIComponent(state.user));
  const res = await fetch(api("/api/state" + query));
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || "Could not open the chat");
  if (gen !== state.loadGen) return;
  state.data = body;
  if (signedIn && body.viewer && body.viewer.id) state.user = body.viewer.id;
  else if (body.users.length && !body.users.some((user) => user.id === state.user)) state.user = body.viewer.id;
  render();
}

function render() {
  const data = state.data;
  if (!data) return;
  renderFabrics(data);
  maybeWelcome();
  const select = $("user");
  const signedIn = state.session && state.session.signed_in;
  if (signedIn || !data.users.length) {
    select.hidden = true;
    select.replaceChildren();
  } else {
    select.hidden = false;
    const ids = data.users.map((user) => user.id).join(",");
    if (select.dataset.ids !== ids) {
      select.replaceChildren();
      for (const user of data.users) select.append(el("option", { value: user.id, text: user.name }));
      select.dataset.ids = ids;
    }
    select.value = data.viewer.id;
  }
  renderFeed(data.feed);
  const held = data.feed.reduce((sum, thread) => sum + thread.held.length, 0);
  const note = $("held");
  note.hidden = held === 0;
  note.textContent = held + " more held";
  renderExtra();
  paintWhere();
}

function visibleThreads(threads) {
  const list = (threads || []).slice();
  if (state.room && state.open && !list.some((thread) => thread.thread === state.open)) {
    const marked = state.highlight
      ? state.room.messages.find((message) => message.id === state.highlight)
      : null;
    const message = marked || state.room.messages[0] || null;
    list.unshift({
      id: state.room.id,
      thread: state.room.thread,
      title: state.room.title,
      topic: state.room.topic,
      nearness: "",
      distance: 0,
      score: 0,
      messages: message ? [message] : [],
      held: [],
      plain: Boolean(state.room.plain),
    });
  }
  return list;
}

function openingLine(text) {
  const line = String(text || "").split("\n").find((item) => item.trim());
  return line ? line.trim() : "";
}

function restAfter(text) {
  const lines = String(text || "").split("\n");
  const index = lines.findIndex((item) => item.trim());
  if (index < 0) return "";
  return lines.slice(index + 1).join("\n").trim();
}

function renderFeed(threads) {
  const feed = $("feed");
  feed.replaceChildren();
  const list = visibleThreads(threads);
  if (!list.length) {
    feed.append(el("p", { class: "empty", text: "Nothing in this phext yet." }));
    return;
  }
  const limit = state.feedShown || 40;
  let shown = list.slice(0, limit);
  if (state.open) {
    const open = list.find((thread) => thread.thread === state.open);
    if (open && !shown.some((thread) => thread.thread === state.open)) shown = [open].concat(shown);
  }
  for (const thread of shown) {
    const item = el("article", { class: "item" });
    const message = thread.messages[0];
    const named = message && message.author && message.author !== "phext" && !thread.plain;
    const preview = message
      ? (named ? message.author + ": " : "") + (message.preview || message.text)
      : (thread.plain ? "" : "No notes yet");
    const row = el("button", {
      type: "button",
      class: "row",
      "aria-expanded": state.open === thread.thread ? "true" : "false",
      onclick: () => toggleThread(thread),
    }, [
      el("span", { class: "title", text: thread.title }),
      preview ? el("span", { class: "preview", text: preview }) : null,
    ]);
    const line = el("div", { class: "rowline" }, [
      row,
      el("button", {
        type: "button",
        class: "copylink for-thread",
        text: "link",
        "aria-label": "Copy link to this thread",
        onclick: (event) => copyPath(event, "/l/" + thread.id),
      }),
      state.open === thread.thread
        ? el("a", {
            class: "copylink for-thread",
            href: root() + "/l/" + thread.id + "/chat.phext",
            text: "fork",
            "aria-label": "Download this thread",
          })
        : null,
    ]);
    item.append(line);
    if (thread.nearness) {
      item.append(el("p", {
        class: "meta",
        text: thread.thread + " · " + thread.nearness + " · distance " + thread.distance + " · score " + thread.score.toFixed(2),
      }));
    } else if (thread.plain) {
      item.append(el("p", { class: "meta", text: thread.thread }));
    }
    const reading = el("div", { class: "reading" });
    if (state.open === thread.thread) fillReading(reading);
    else reading.hidden = true;
    item.append(reading);
    feed.append(item);
  }
  if (list.length > limit) {
    feed.append(el("button", {
      type: "button",
      class: "texty more",
      text: "more",
      onclick: () => {
        state.feedShown = (state.feedShown || 40) + 40;
        renderFeed(state.data.feed);
      },
    }));
  }
  if (state.scrollToMark) {
    const marked = feed.querySelector(".msg.mark");
    if (marked) marked.scrollIntoView({ block: "center" });
    state.scrollToMark = false;
  }
}

function fillReading(host) {
  host.hidden = false;
  host.replaceChildren();
  const room = state.room;
  if (!room) {
    host.append(el("p", { class: "empty", text: "Opening…" }));
    return;
  }
  if (room.thread !== state.open) return;
  for (const message of room.messages) {
    const plain = Boolean(room.plain) || message.author === "phext";
    const marked = state.highlight === message.id;
    const link = el("button", {
      type: "button",
      class: "copylink",
      text: "link",
      "aria-label": "Copy link to this message",
      onclick: (event) => copyPath(event, "/p/" + message.id),
    });
    const coord = el("span", { class: "coord", text: message.coord });
    let body;
    if (plain) {
      const title = el("p", { class: "post-title", text: openingLine(message.text) || "Scroll" });
      title.append(" ");
      title.append(link);
      title.append(coord);
      const rest = restAfter(message.text);
      body = [title, rest ? linkedText("p", rest) : null];
    } else {
      const by = el("p", { class: "by" });
      by.append(message.author + " ");
      by.append(link);
      by.append(coord);
      body = [by, linkedText("p", message.text)];
    }
    host.append(el("article", {
      class: marked ? "msg mark" : "msg",
      id: marked ? "marked" : null,
    }, body));
  }
  if (!room.messages.length) host.append(el("p", { class: "empty", text: "No notes yet. The box below replies here, or starts a thread." }));
  if (room.more) {
    host.append(el("button", {
      type: "button",
      class: "texty more",
      text: "more",
      onclick: () => loadMorePosts().catch((err) => setStatus(err.message, true)),
    }));
  }
}

function routeFromPath() {
  let path = location.pathname;
  const base = root();
  if (base) {
    if (path === base || path === base + "/") return null;
    if (!path.startsWith(base + "/")) return null;
    path = path.slice(base.length);
  }
  const match = /^\/([lp])\/(.+?)\/?$/.exec(path);
  if (!match || match[2].endsWith("/chat.phext")) return null;
  return { kind: match[1], id: decodeURIComponent(match[2]) };
}

// A nine-part phext address (1.1.1/1.1.2/1.1.3), with an optional /l/ or
// /p/ in front. Semicolons count as slashes. Without a prefix, a thread card
// (…/1.1.1) opens the thread and any other scroll opens that post.
const COORD_LINK = /(\/[lp]\/)?(?<![\d.])(\d{1,4}\.\d{1,4}\.\d{1,4}[\/;]\d{1,4}\.\d{1,4}\.\d{1,4}[\/;]\d{1,4}\.\d{1,4}\.\d{1,4})(?!\d|\.\d|[\/;]\d)/g;

function linkedText(tag, text) {
  const node = el(tag);
  let last = 0;
  for (const match of text.matchAll(COORD_LINK)) {
    const coord = match[2].replace(/;/g, "/");
    const kind = match[1] ? match[1][1] : (coord.endsWith("/1.1.1") ? "l" : "p");
    node.append(text.slice(last, match.index));
    const path = "/" + kind + "/" + coord;
    node.append(el("a", {
      href: root() + path,
      text: match[0],
      onclick: (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button) return;
        event.preventDefault();
        go(path);
        applyRoute().catch((err) => setStatus(err.message, true));
      },
    }));
    last = match.index + match[0].length;
  }
  node.append(text.slice(last));
  return node;
}

function go(path) {
  const target = path === "/" ? (root() || "/") : root() + path;
  if (location.pathname !== target) history.pushState(null, "", target);
}

function renderFabrics(data) {
  const select = $("fabric");
  const names = (data.fabrics || []).map((item) => item.name).join("\n");
  if (select.dataset.names !== names) {
    select.replaceChildren();
    for (const item of data.fabrics || []) {
      select.append(el("option", { value: item.name, text: item.label }));
    }
    select.dataset.names = names;
  }
  if ([...select.options].some((option) => option.value === (data.fabric || ""))) {
    select.value = data.fabric || "";
  }
}

function showCreateNote(kind) {
  const note = $("create-note");
  note.hidden = false;
  note.replaceChildren();
  if (kind === "signin") {
    note.textContent = "Sign in to create a fabric.";
    return;
  }
  note.append(el("a", {
    href: "https://mirrorborn.us",
    text: "Founding plot holders in Tessera can create fabrics.",
  }));
}

async function refreshCreate() {
  if (!state.session || !state.session.signed_in) {
    showCreateNote("signin");
    $("create-form").hidden = true;
    return;
  }
  const key = $("plot-key").value.trim();
  const headers = {};
  if (key) headers.authorization = "Bearer " + key;
  const res = await fetch(api("/api/fabrics/access"), { headers });
  const body = await res.json().catch(() => ({}));
  const allowed = Boolean(body.create);
  if (allowed) $("create-note").hidden = true;
  else showCreateNote("plot");
  $("create-form").hidden = !allowed;
}

async function createEmpty() {
  const res = await fetch(api("/api/fabrics"), {
    method: "POST",
    headers: writeHeaders({
      "content-type": "application/json",
      authorization: "Bearer " + $("plot-key").value.trim(),
    }),
    body: JSON.stringify({ name: $("fabric-name").value.trim() }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    setStatus(body.error || "Could not create that fabric", true);
    await refreshCreate();
    return;
  }
  location.assign("/f/" + encodeURIComponent(body.name) + "/");
}

async function uploadFabric() {
  const file = $("fabric-file").files && $("fabric-file").files[0];
  if (!file) {
    setStatus("Choose a .phext file.", true);
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    setStatus("That file is larger than 5 MB.", true);
    return;
  }
  const name = $("fabric-name").value.trim();
  let path = api("/api/fabrics/upload");
  if (name) path += "?name=" + encodeURIComponent(name);
  const res = await fetch(path, {
    method: "POST",
    headers: writeHeaders({
      "content-type": "application/octet-stream",
      authorization: "Bearer " + $("plot-key").value.trim(),
    }),
    body: file,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    setStatus(body.error || "Could not create that fabric", true);
    await refreshCreate();
    return;
  }
  location.assign("/f/" + encodeURIComponent(body.name) + "/");
}

async function copyPath(event, path) {
  event.preventDefault();
  event.stopPropagation();
  const url = location.origin + root() + path;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      setStatus("Link copied.", false);
      return;
    }
  } catch (err) {
    /* show the address when the clipboard is unavailable */
  }
  setStatus(url, false);
}

async function toggleThread(thread) {
  if (state.open === thread.thread) {
    state.routeGen += 1;
    state.open = null;
    state.room = null;
    state.highlight = null;
    state.scrollToMark = false;
    go("/");
    render();
    return;
  }
  state.routeGen += 1;
  state.open = thread.thread;
  state.highlight = null;
  state.scrollToMark = false;
  state.room = null;
  if (thread.id) go("/l/" + thread.id);
  render();
  await loadLane(thread.id, 0);
}

async function openLinked(route) {
  const gen = ++state.routeGen;
  const res = await fetch(api("/api/" + route.kind + "/" + route.id));
  const body = await res.json().catch(() => ({}));
  if (gen !== state.routeGen) return;
  if (!res.ok) {
    state.open = null;
    state.room = null;
    state.highlight = null;
    if (state.data) render();
    setStatus(body.error || "That link doesn't go anywhere.", true);
    return;
  }
  state.open = body.thread;
  state.room = body;
  state.highlight = body.highlight || null;
  state.scrollToMark = Boolean(state.highlight);
  if (state.data) render();
}

async function applyRoute() {
  const route = routeFromPath();
  if (!route) {
    state.open = null;
    state.room = null;
    state.highlight = null;
    state.scrollToMark = false;
    if (state.data) render();
    return;
  }
  await openLinked(route);
}

async function loadLane(id, offset) {
  if (!id) return;
  const open = state.open;
  const res = await fetch(api("/api/l/" + id + "?offset=" + String(offset || 0)));
  const body = await res.json().catch(() => ({}));
  if (state.open !== open) return;
  if (!res.ok) {
    setStatus(body.error || "Could not open that thread", true);
    return;
  }
  if (offset && state.room && state.room.id === body.id) {
    const seen = new Set(state.room.messages.map((message) => message.id));
    for (const message of body.messages || []) {
      if (!seen.has(message.id)) state.room.messages.push(message);
    }
    state.room.more = Boolean(body.more);
    state.room.message_count = body.message_count;
  } else {
    state.room = body;
  }
  if (state.data) paintReading();
}

function paintReading() {
  if (!state.data) return;
  const openRow = [...document.querySelectorAll("#feed .row")].find((row) => row.getAttribute("aria-expanded") === "true");
  const reading = openRow && openRow.closest(".item") && openRow.closest(".item").querySelector(".reading");
  if (!reading || !state.room || state.room.thread !== state.open) {
    renderFeed(state.data.feed);
    return;
  }
  fillReading(reading);
}

async function loadMorePosts() {
  const room = state.room;
  if (!room || !room.more || !room.id) return;
  const offset = (room.offset || 0) + room.messages.length;
  await loadLane(room.id, offset);
}

function renderExtra() {
  const host = $("extra");
  const on = document.body.classList.contains("details");
  host.hidden = !on;
  host.replaceChildren();
  if (!on || !state.data) return;
  const data = state.data;
  host.append(el("p", { text: data.file }));
  host.append(el("p", { text: "An author with " + data.loud_at + " or more messages is kept to " + data.cap + " lines." }));
  for (const lane of data.lanes) {
    host.append(el("p", { text: lane.author + " · " + lane.held + " held, " + lane.shown + " shown" }));
  }
  if (data.demo) {
    const reset = el("button", { type: "button", class: "texty", text: "Reset demo" });
    reset.addEventListener("click", () => resetDemo(reset));
    host.append(reset);
  }
  const tocKey = (data.fabric || "") + ":" + state.loadGen;
  if (state.tocKey === tocKey && state.tocText) {
    host.append(el("pre", { id: "toc", text: state.tocText }));
    return;
  }
  host.append(el("pre", { id: "toc", text: "Loading…" }));
  fetch(api("/api/toc")).then((res) => res.json()).then((body) => {
    const lines = body.error ? body.error : body.threads.map((thread) => thread.thread + "  " + thread.title).join("\n") + "\n\n" + body.textmap;
    state.tocKey = tocKey;
    state.tocText = lines;
    const toc = $("toc");
    if (toc) toc.textContent = lines;
  }).catch(() => {
    const toc = $("toc");
    if (toc) toc.textContent = "Could not read the file.";
  });
}

function renderPicker() {
  const host = $("picker");
  host.hidden = !state.picker;
  host.replaceChildren();
  if (!state.picker || !state.data) return;
  host.append(el("button", {
    type: "button",
    text: "Automatic",
    onclick: () => choose(null),
  }));
  const threads = state.data.map.slice().sort((a, b) => a.title.localeCompare(b.title));
  for (const thread of threads) {
    host.append(el("button", {
      type: "button",
      text: thread.title,
      onclick: () => choose(thread),
    }));
  }
}

function choose(thread) {
  state.override = thread ? { thread: thread.thread, title: thread.title } : null;
  state.picker = false;
  renderPicker();
  paintWhere();
}

async function runSuggest() {
  const gen = ++state.suggestGen;
  const url = new URL(api("/api/suggest"), location.origin);
  if (!(state.session && state.session.signed_in)) url.searchParams.set("user", state.user);
  url.searchParams.set("text", $("text").value);
  if (state.fresh) url.searchParams.set("fresh", "1");
  const res = await fetch(url);
  const body = await res.json();
  if (gen !== state.suggestGen) return;
  if (!res.ok) throw new Error(body.error || "Could not choose a thread");
  state.suggestion = body;
  paintWhere();
}

function scheduleSuggest() {
  clearTimeout(state.timer);
  state.timer = setTimeout(() => {
    runSuggest().catch((err) => setStatus(err.message, true));
  }, 160);
}

async function place(event) {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text) {
    setStatus("Write a message first.", true);
    return;
  }
  if (!state.session || !state.session.ready) {
    setStatus("Sign-in is not set up yet.", false);
    return;
  }
  if (!state.session.signed_in) {
    setStatus("Sign in to do that.", true);
    return;
  }
  setStatus("", false);
  const open = !state.fresh && !state.override ? replyTarget() : null;
  const coord = state.fresh
    ? ((state.suggestion && state.suggestion.coord) || "")
    : state.override
      ? state.override.thread
      : open
        ? open.thread
        : ((state.suggestion && state.suggestion.coord) || "");
  const res = await fetch(api("/api/post"), {
    method: "POST",
    headers: writeHeaders({ "content-type": "application/json" }),
    body: JSON.stringify({ user: state.user, text, coord }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || "Could not post");
  $("text").value = "";
  state.override = null;
  state.suggestion = null;
  setStatus("Posted to " + body.title + ".", false);
  await loadState();
  if (routeFromPath()) await applyRoute();
  else if (state.room && state.room.id) await loadLane(state.room.id, 0);
  await runSuggest();
}

async function resetDemo(button) {
  if (button.dataset.armed !== "1") {
    button.dataset.armed = "1";
    button.textContent = "Reset demo?";
    setTimeout(() => {
      button.dataset.armed = "0";
      button.textContent = "Reset demo";
    }, 2500);
    return;
  }
  const res = await fetch(api("/api/reset"), { method: "POST", headers: writeHeaders({}) });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    setStatus(body.error || "Reset failed", true);
    return;
  }
  state.open = null;
  state.room = null;
  state.highlight = null;
  state.override = null;
  $("text").value = "";
  setStatus("Demo restored.", false);
  await loadState();
  await applyRoute();
  await runSuggest();
}

$("fabric").addEventListener("change", () => {
  const name = $("fabric").value;
  location.assign(name ? "/f/" + encodeURIComponent(name) + "/" : "/");
});

$("create-fabric").addEventListener("click", () => {
  const panel = $("create-panel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden) refreshCreate().catch((err) => setStatus(err.message, true));
});

$("plot-key").addEventListener("input", () => {
  refreshCreate().catch((err) => setStatus(err.message, true));
});

$("fabric-empty").addEventListener("click", () => {
  createEmpty().catch((err) => setStatus(err.message, true));
});

$("fabric-upload").addEventListener("click", () => {
  uploadFabric().catch((err) => setStatus(err.message, true));
});

$("user").addEventListener("change", () => {
  state.user = $("user").value;
  localStorage.setItem("lanes.user", state.user);
  state.override = null;
  setStatus("", false);
  loadState()
    .then(() => applyRoute())
    .then(() => runSuggest())
    .catch((err) => setStatus(err.message, true));
});

$("signout").addEventListener("click", () => {
  fetch("/auth/logout", { method: "POST", headers: writeHeaders({}) })
    .then(() => location.assign("/"))
    .catch((err) => setStatus(err.message, true));
});

$("welcome-go").addEventListener("click", () => {
  const url = new URL(location.href);
  url.searchParams.delete("welcome");
  history.replaceState(null, "", url.pathname + url.search);
  maybeWelcome();
  render();
});

$("fresh").addEventListener("click", () => {
  state.fresh = !state.fresh;
  state.override = null;
  state.picker = false;
  renderPicker();
  paintWhere();
  runSuggest().catch((err) => setStatus(err.message, true));
});

$("signin").addEventListener("click", () => {
  const session = state.session || {};
  if (session.signed_in) return;
  if (!session.ready || !(session.providers || []).length) {
    setStatus("Sign-in is not set up yet.", false);
    return;
  }
  const next = authNext();
  if (session.providers.length === 1) {
    location.assign("/auth/" + session.providers[0] + "?next=" + next);
    return;
  }
  const choices = $("signin-choices");
  $("signin-github").href = "/auth/github?next=" + next;
  $("signin-google").href = "/auth/google?next=" + next;
  $("signin-github").hidden = session.providers.indexOf("github") < 0;
  $("signin-google").hidden = session.providers.indexOf("google") < 0;
  choices.hidden = !choices.hidden;
});

$("details").addEventListener("click", () => {
  const on = !document.body.classList.contains("details");
  document.body.classList.toggle("details", on);
  $("details").setAttribute("aria-pressed", on ? "true" : "false");
  renderExtra();
});

$("change").addEventListener("click", () => {
  state.picker = !state.picker;
  renderPicker();
});

$("text").addEventListener("input", () => {
  setStatus("", false);
  if (!state.override) scheduleSuggest();
});

$("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("composer").addEventListener("submit", (event) => {
  place(event).catch((err) => setStatus(err.message, true));
});

window.addEventListener("popstate", () => {
  applyRoute().catch((err) => setStatus(err.message, true));
});

loadSession()
  .catch(() => { state.session = { ready: false, providers: [] }; paintSignIn(); })
  .then(() => loadState())
  .then(() => applyRoute())
  .then(() => runSuggest())
  .catch((err) => {
    if (!state.data) $("feed").replaceChildren(el("p", { class: "empty", text: err.message }));
    else setStatus(err.message, true);
  });
</script>
</body>
</html>
